name: "Bug / Fallo"
description: "Something doesn't work, or works wrong / Algo no funciona o funciona mal"
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it! Write in English or in Spanish.
        ¡Gracias por avisar! Escribe en inglés o en español.
  - type: textarea
    id: what
    attributes:
      label: "What happens? / ¿Qué pasa?"
      description: "What you see, and what you expected to see / Lo que ves, y lo que esperabas ver"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "How to make it happen / Cómo hacer que pase"
      description: "Level, menu, buttons you pressed... / Nivel, menú, botones que pulsaste..."
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: "Where do you play? / ¿Dónde juegas?"
      options:
        - PSP-1000
        - PSP-2000
        - PSP-3000
        - PSP Go
        - PSP Street (E1000)
        - PPSSPP (PC)
        - PPSSPP (Android / iOS)
        - Other / Otro
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: "Firmware or emulator version / Versión del firmware o del emulador"
      placeholder: "6.61 ARK-4, PPSSPP 1.18..."
  - type: input
    id: version
    attributes:
      label: "Game version / Versión del juego"
      description: "It is in the title of the game in the PSP menu / Está en el título del juego en el menú de la PSP"
      placeholder: "0.5.0-alpha"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: "The game's log (log.txt) / El registro del juego (log.txt)"
      description: |
        From version 0.5.0 on, the game writes everything that happens in log.txt: from 0.5.1 on it is data/cache/log.txt in its folder (PSP/GAME/.../platform-shooter/data/cache/), in 0.5.0 next to EBOOT.PBP. Close the game with HOME after the bug, then drag log.txt into this box. If your version is older than 0.5.0, write "none".
        Desde la versión 0.5.0, el juego apunta todo lo que pasa en log.txt: desde la 0.5.1 es data/cache/log.txt en su carpeta (PSP/GAME/.../platform-shooter/data/cache/), en la 0.5.0 junto a EBOOT.PBP. Cierra el juego con HOME después del fallo y arrastra log.txt a este cuadro. Si tu versión es anterior a la 0.5.0, escribe "none".
      placeholder: "Drag log.txt here / Arrastra log.txt aquí"
    validations:
      required: true
  - type: checkboxes
    id: log_attached
    attributes:
      label: "The log / El registro"
      options:
        - label: "I attached log.txt (or my version is older than 0.5.0) / He adjuntado log.txt (o mi versión es anterior a la 0.5.0)"
          required: true
  - type: textarea
    id: packs
    attributes:
      label: "Packs turned on / Paquetes activados"
      description: "The texture packs you have on, if any / Los paquetes de texturas que tengas activados, si hay"
  - type: textarea
    id: more
    attributes:
      label: "Anything else / Algo más"
      description: "Screenshots, videos... / Capturas, vídeos..."
